# Toolchains for this repository. Bun follows CI (.github/workflows/ci.yml).
# Rust is only needed for companion/.
#
#   mise install      # once per machine; worktrees reuse the same installs

[tools]
bun = "1.3.14"
rust = { version = "stable", components = "clippy,rustfmt" }
sccache = "latest"

[env]
RUSTC_WRAPPER = "sccache"
SCCACHE_CACHE_SIZE = "20G"
CARGO_BUILD_JOBS = "3"
