<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>woofx3 — Live stream management</title>
  <meta name="description"
    content="woofx3: live stream management with workflow automation, asset management, and scene editing. Control your broadcast like a pro." />
  <script>
    // Sets the mode before first paint so the page does not flash the wrong one.
    // Mirrors the mode key and resolution in client/src/lib/theme/store.ts.
    (() => {
      var mode = null;
      try {
        mode = JSON.parse(localStorage.getItem("streamdeck-theme"));
      } catch {}
      if (mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
