name: Companion release

# Builds, signs and publishes the woofx3 companion when a `companion-v<version>`
# tag is pushed, then points installed companions at it through the
# companion-latest prerelease. See docs/ops/companion-releases.md.
on:
  push:
    tags: ["companion-v*"]

# Releases queue behind each other and are never cancelled halfway, so two
# can never race to write companion-latest.
concurrency:
  group: companion-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  # The rolling prerelease whose latest.json installed companions read. Must
  # match `plugins.updater.endpoints` in companion/src-tauri/tauri.conf.json.
  LATEST_TAG: companion-latest

jobs:
  check-version:
    name: Check the tag against the app version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The updater compares versions from tauri.conf.json, and the signature
      # is bound to that version, so a tag naming any other version would
      # publish a release that does not say what it is.
      - name: Compare the tag with tauri.conf.json and Cargo.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
          if [[ ! "$TAG" =~ ^companion-v${semver}$ ]]; then
            echo "::error::Tag ${TAG} is not companion-v<semver>, e.g. companion-v1.2.3"
            exit 1
          fi
          version="${TAG#companion-v}"
          conf_version="$(jq -r '.version' companion/src-tauri/tauri.conf.json)"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --manifest-path companion/src-tauri/Cargo.toml | jq -r '.packages[0].version')"
          mismatch=0
          if [[ "$conf_version" != "$version" ]]; then
            echo "::error file=companion/src-tauri/tauri.conf.json::version is ${conf_version}, but the tag is ${TAG}"
            mismatch=1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error file=companion/src-tauri/Cargo.toml::version is ${cargo_version}, but the tag is ${TAG}"
            mismatch=1
          fi
          if [[ "$mismatch" != 0 ]]; then
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build, sign and release
    needs: check-version
    runs-on: windows-latest
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secrets and build variables
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret ${name} is not set on the production environment"
              missing=1
            fi
          done
          if [[ -z "$VITE_CONVEX_URL" ]]; then
            echo "::error::Variable VITE_CONVEX_URL is not set on the production environment"
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install companion dependencies
        working-directory: companion
        run: bun install --frozen-lockfile

      # Signs the installer with the version from tauri.conf.json bound into the
      # signature (the companion requires that), uploads it with its .sig, and
      # writes latest.json into the release.
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WOOFX3_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tagName: ${{ github.ref_name }}
          releaseName: woofx3 companion ${{ needs.check-version.outputs.version }}
          releaseBody: Download the installer below (the file ending in -setup.exe). Installed companions update themselves.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish-latest:
    name: Point companion-latest at this release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      # tauri-action writes API asset URLs (`/releases/assets/<id>`) into
      # latest.json. The public download URL of the same asset needs no API
      # call, so it is not subject to the API's rate limit for anonymous
      # clients, and it names the release it belongs to.
      - name: Point latest.json at this release's download URLs
        run: |
          mkdir release
          gh release download "$TAG" --pattern latest.json --dir release
          gh api "repos/${GH_REPO}/releases/tags/${TAG}" \
            --jq '[.assets[] | {key: (.id | tostring), value: .name}] | from_entries' > release/asset-names.json
          base="https://github.com/${GH_REPO}/releases/download/${TAG}/"
          jq --arg base "$base" --arg version "$VERSION" --slurpfile names release/asset-names.json '
            def asset_name:
              if test("/releases/assets/[0-9]+$") then
                $names[0][capture("/releases/assets/(?<id>[0-9]+)$").id]
                  // error("latest.json names an asset this release does not have: \(.)")
              elif startswith($base) then
                ltrimstr($base)
              else
                error("latest.json has a download URL outside this release: \(.)")
              end;
            if (.version | ltrimstr("v")) != $version then
              error("latest.json announces \(.version), not \($version)")
            elif (.platforms["windows-x86_64"] | not) then
              error("latest.json has no windows-x86_64 entry")
            else
              .platforms |= map_values(.url |= ($base + (asset_name | @uri)))
            end
          ' release/latest.json > release/latest.rewritten.json
          mv release/latest.rewritten.json release/latest.json
          cat release/latest.json
          gh release upload "$TAG" release/latest.json --clobber

      # companion-latest is a prerelease so it can never become the
      # repository's "latest release": other releases in this repository must
      # not be able to change what installed companions update to.
      - name: Publish latest.json to companion-latest
        run: |
          if gh release view "$LATEST_TAG" > /dev/null 2>&1; then
            current="$(gh release download "$LATEST_TAG" --pattern latest.json --output - | jq -r '.version' || true)"
            newest="$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)"
            if [[ -n "$current" && "$current" != "$VERSION" && "$newest" != "$VERSION" ]]; then
              echo "::error::${LATEST_TAG} already points at ${current}, which is newer than ${VERSION}"
              exit 1
            fi
          else
            gh release create "$LATEST_TAG" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "woofx3 companion updates" \
              --notes "Not a release to download. Installed companions read latest.json here to find their next update."
          fi
          gh release edit "$LATEST_TAG" --prerelease
          gh release upload "$LATEST_TAG" release/latest.json --clobber
